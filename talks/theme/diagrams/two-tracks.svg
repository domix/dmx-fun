<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 380" role="img" aria-label="Two tracks: success on top, failure below; a failure switches tracks and skips the remaining steps">
  <style>
    .ok   { stroke: var(--dmx-ok, #58a6ff); }
    .err  { stroke: var(--dmx-err, #d29922); }
    .mono { font: 500 30px 'JetBrains Mono', ui-monospace, monospace; fill: var(--dmx-text, #c9d1d9); }
    .tag  { font: 650 30px 'Inter Variable', Inter, system-ui, sans-serif; }
    .tag.ok  { fill: var(--dmx-ok, #58a6ff); stroke: none; }
    .tag.err { fill: var(--dmx-err, #d29922); stroke: none; }
    .step { fill: var(--dmx-surface, #161b22); stroke: var(--dmx-border, #30363d); stroke-width: 2; }
  </style>
  <!-- success track -->
  <line x1="40" y1="120" x2="1560" y2="120" class="ok" stroke-width="8"/>
  <!-- failure track -->
  <line x1="40" y1="320" x2="1560" y2="320" class="err" stroke-width="8"/>
  <!-- steps on the success track -->
  <g>
    <rect x="160" y="75" width="300" height="90" rx="14" class="step"/>
    <text x="310" y="131" text-anchor="middle" class="mono">findStudent</text>
    <rect x="560" y="75" width="300" height="90" rx="14" class="step"/>
    <text x="710" y="131" text-anchor="middle" class="mono">findCourse</text>
    <rect x="960" y="75" width="300" height="90" rx="14" class="step"/>
    <text x="1110" y="131" text-anchor="middle" class="mono">charge</text>
  </g>
  <!-- a failure switches tracks and skips the rest -->
  <path d="M 860 120 C 910 120, 910 320, 960 320" class="err" stroke-width="8" fill="none"/>
  <text x="1420" y="100" text-anchor="middle" class="tag ok">Ok</text>
  <text x="1420" y="300" text-anchor="middle" class="tag err">Err</text>
</svg>
