# Verifies that the fun-jackson2 module remains compatible with multiple Jackson 2
# versions. Jackson is declared as compileOnly so users bring their own version;
# this matrix catches regressions against older (but still supported) releases
# before they reach main.
#
# Triggered only on pull requests that touch serialization/jackson2/** or this workflow file.
# To run a specific version locally:
#   ./gradlew :serialization:jackson2:test -Pjackson2Version=2.15.4
name: Jackson 2 compatibility

on:
  pull_request:
    # Run when the jackson module or this workflow file is modified.
    paths:
      - 'serialization/jackson2/**'
      - '.github/workflows/jackson2-compatibility.yaml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # One entry per minor line from 2.14 to the current release, each at its latest patch.
        # Update this list when a new minor is released or an old one is EOL.
        jackson-version: ['2.14.3', '2.15.4', '2.16.2', '2.17.3', '2.18.12', '2.19.4', '2.20.2', '2.21.8', '2.22.4', '2.23.0']
    name: Jackson 2 ${{ matrix.jackson-version }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-java@v5.2.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      # Pass the matrix version as a Gradle property; the build falls back to
      # the catalog version when the property is absent (local development).
      - run: ./gradlew :serialization:jackson2:test -Pjackson2Version=${{ matrix.jackson-version }}
