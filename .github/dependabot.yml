version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "javascript"
      - "site"
    commit-message:
      prefix: "chore(deps)"
    groups:
      site-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
