// ── Jackson 3 integration module ──────────────────────────────────────────────
// Optional module — users must already have Jackson 3 (tools.jackson.*) on their
// classpath. Provides serializers and deserializers for all dmx-fun types.
// The Jackson 2 line (com.fasterxml.jackson.*) lives in :serialization:jackson2.
plugins {
    id 'dmx-fun.java-module'
}

dependencies {
    // Exposes dmx-fun types to callers; they only need one dependency declaration.
    api project(':core:lib')

    // Jackson 3 is an optional peer dependency: declared compileOnly so it is not
    // pulled in transitively. Users bring their own version.
    compileOnly libs.jackson3.databind

    // Tests run against the version passed via -Pjackson3Version=X.Y.Z (used by
    // the CI compatibility matrix), falling back to the catalog version locally.
    testImplementation "tools.jackson.core:jackson-databind:${findProperty('jackson3Version') ?: libs.versions.jackson3.get()}"

    // Fluent assertions for dmx-fun types (ResultAssert, TryAssert, etc.).
    // compileOnly puts dmx.fun.assertj on compileClasspath so the JPMS module-path
    // plugin can expose it to compileTestJava; testImplementation covers test runtime.
    // assertj-core is already on the classpath via dmx-fun.java-base.
    compileOnly        project(':core:assertj')
    testImplementation project(':core:assertj')
}

jpmsTest {
    moduleName   = 'dmx.fun.jackson3'
    extraModules = ['dmx.fun.assertj']
    extraReads   = ['dmx.fun.assertj']
}

// assertj-core is on the classpath (unnamed module) at compile time but dmx.fun.assertj
// is on the module path and requires it. This read allows the compiler to resolve it.
// The JPMS module name mirrors the artifact (fun-jackson3) and ends in a digit on purpose;
// javac's "module name component should avoid terminal digits" lint does not apply.
tasks.named('compileJava') {
    options.compilerArgs += ['-Xlint:-module']
}

tasks.named('compileTestJava') {
    options.compilerArgs += ['--add-reads', 'dmx.fun.assertj=ALL-UNNAMED']
}

mavenPublishing {
    coordinates("codes.domix", "fun-jackson3", "${project.version}")
    pom {
        name = 'dmx-fun Jackson 3 integration'
        description = 'Jackson 3 (tools.jackson) module for dmx-fun: serializers and deserializers for Option, Result, Try, Validated, Either, Lazy, Tuple2/3/4, NonEmptyList, NonEmptySet, and NonEmptyMap.'
    }
}
